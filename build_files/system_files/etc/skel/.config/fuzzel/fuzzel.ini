# Pixel Guild look. Colours: the design system's tokens, from ~/.config/eww/_tokens.scss
# (surface 20173A, fg F3ECFF, accent FF7AA8, on-accent 150F28), written as RRGGBBAA, opaque except the background,
# whose alpha byte is $widget-alpha of _tokens.scss (0.70 -> b2) like every widget background.
[main]
font=IBM Plex Mono:size=13
prompt="❯ "
terminal=alacritty -e
width=40
layer=overlay
namespace=launcher

[colors]
background=20173ab2
text=f3ecffff
match=ff7aa8ff
selection=ff7aa8ff
selection-text=150f28ff
selection-match=150f28ff
border=f3ecffff

[border]
width=3
radius=0
